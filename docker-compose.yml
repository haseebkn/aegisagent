services:
  aegis_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_app
    environment:
      - DBT_DB_PATH=/app/aegis_db.duckdb
      - DBT_PROFILES_DIR=/app
      - AEGIS_RAW_DATA_DIR=/app
      - MODELS_ARTIFACTS_DIR=/app/models_artifacts
      - COMPLIANCE_LOGS_DIR=/app/compliance_logs
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - COMPLIANCE_S3_BUCKET=${COMPLIANCE_S3_BUCKET:-}
    volumes:
      # Data and credentials only. Application code comes from the image, so a
      # broken image fails here instead of being papered over by a bind mount.
      - ./aegis_db.duckdb:/app/aegis_db.duckdb
      - ./compliance_logs:/app/compliance_logs
      - ~/.aws:/root/.aws:ro
    networks:
      - aegis_net

networks:
  aegis_net:
    driver: bridge
