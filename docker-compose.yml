services:
  aegis_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_app
    command: ["uvicorn", "service:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - DBT_DB_PATH=/app/aegis_db.duckdb
      - DBT_PROFILES_DIR=/app
      - AEGIS_RAW_DATA_DIR=/app
      - MODELS_ARTIFACTS_DIR=/app/models_artifacts
      - COMPLIANCE_LOGS_DIR=/app/compliance_logs
      # The local identity provider is intentionally unavailable in production mode.
      - AEGIS_SECURITY_MODE=development
      - AEGIS_DEV_SUBJECT=${AEGIS_DEV_SUBJECT:-local-investigator}
      - AEGIS_DEV_ORGANIZATION=${AEGIS_DEV_ORGANIZATION:-local-demo}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - COMPLIANCE_S3_BUCKET=${COMPLIANCE_S3_BUCKET:-}
    volumes:
      # Data and credentials only. Application code comes from the image, so a
      # broken image fails here instead of being papered over by a bind mount.
      - ./aegis_db.duckdb:/app/aegis_db.duckdb
      - ./compliance_logs:/app/compliance_logs
      - ~/.aws:/root/.aws:ro
    networks:
      - aegis_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  aegis_net:
    driver: bridge
