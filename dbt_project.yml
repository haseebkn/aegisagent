name: 'aegis_agent'
version: '1.0.0'
config-version: 2

profile: 'aegis_agent'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

# Location of fraudTrain.csv / fraudTest.csv. Override per environment with
#   dbt run --vars '{raw_data_dir: /app}'
vars:
  raw_data_dir: "{{ env_var('AEGIS_RAW_DATA_DIR', '.') }}"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  aegis_agent:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
