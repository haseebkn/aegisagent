name: 'aegis_agent'
version: '1.0.0'
config-version: 2

profile: 'aegis_agent'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

# Location of fraudTrain.csv / fraudTest.csv. Override per environment with
#   dbt run --vars '{raw_data_dir: /app}'
vars:
  raw_data_dir: "{{ env_var('AEGIS_RAW_DATA_DIR', '.') }}"
  # Full Kaggle dataset. CI overrides this for the small fixture.
  expected_row_count: 1852394

clean-targets:
  - "target"
  - "dbt_packages"

models:
  aegis_agent:
    staging:
      +materialized: view
    intermediate:
      # Views, deliberately. Materialising these as tables was measured at 36.8s
      # against 27.6s for the fused view chain -- DuckDB optimises the whole
      # pipeline better than it optimises the pieces. See docs/materialization.md.
      +materialized: view
    marts:
      +materialized: table
